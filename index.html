<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill System</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060b1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--panel:#fff;--line:#b9c6e0;--ink:#101a33;--mute:#5a6a8c;--accent:#1f5eff;--glow:rgba(31,94,255,.18);--bar:#dfe7f6;--danger:#c0334d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b1a;--panel:#0b1530;--line:#1f3a7a;--ink:#e6eeff;--mute:#8aa0cf;--accent:#3d8bff;--glow:rgba(61,139,255,.28);--bar:#12234d;--danger:#ff5d7a}}
:root[data-theme="dark"]{--bg:#060b1a;--panel:#0b1530;--line:#1f3a7a;--ink:#e6eeff;--mute:#8aa0cf;--accent:#3d8bff;--glow:rgba(61,139,255,.28);--bar:#12234d;--danger:#ff5d7a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
section.panel,article.panel{margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:0 0 22px var(--glow)}
.status{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rank{width:92px;height:92px;display:grid;place-items:center;font-size:54px;font-weight:700;border:2px solid var(--accent);border-radius:6px;color:var(--accent);text-shadow:0 0 14px var(--glow)}
h1{margin:0;font-size:22px}h2{margin:0;font-size:19px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.mute{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--bar);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.grid .panel{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-weight:700;font-size:24px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;width:42px;height:42px;display:grid;place-items:center;flex:none}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{min-height:44px;padding:0 14px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;cursor:pointer}
button:hover{background:var(--glow)}button:disabled{opacity:.4;cursor:default}
button.solid,.tabs button.on{background:var(--accent);color:var(--on,#fff)}
button.quiet{border-color:var(--line);color:var(--mute)}
button.del{border-color:var(--danger);color:var(--danger)}
input,select{min-height:44px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;width:100%}
input[type=range]{padding:0;min-height:30px}input[type=checkbox]{width:24px;min-height:24px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.form{display:none;margin-top:12px;gap:8px;grid-template-columns:1fr 1fr}
.form.open{display:grid}.form .full{grid-column:1/-1}
.tabs{display:flex;gap:8px;margin:12px 0 16px}.tabs button{flex:1}
#ban{display:none;background:var(--accent);color:var(--on,#fff);padding:10px 14px;border-radius:4px;margin-bottom:12px}
.q{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q>span{color:var(--mute);font-weight:700}.q.ok>span{color:var(--accent)}
.q .quick{margin:0}
.boss{border:1px solid var(--accent);background:var(--glow);padding:10px;border-radius:4px;margin-top:10px}
.warn{color:var(--danger);font-size:14px;margin-top:6px}
.logs{margin-top:10px;font-size:13px;color:var(--mute)}
.logs div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-top:1px solid var(--line)}
.logs button{min-height:30px;padding:0 8px;font-size:12px;flex:none}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{min-height:36px;cursor:pointer;color:var(--accent);font-weight:600}
.sub{margin-top:14px}.sub>b{display:block;margin-bottom:6px}
.st{display:grid;grid-template-columns:1fr 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.radar{width:100%;max-width:240px;display:block;margin:6px auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:6px}
.heat i{display:block;width:16px;height:16px;border-radius:3px;background:var(--accent)}
.heat .h0{background:var(--bar)}.h1{opacity:.3}.h2{opacity:.55}.h3{opacity:.8}.h4{opacity:1}.hx{visibility:hidden}
.tl div{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:14px;font-size:14px}
textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;font:12px monospace}
.ring{display:flex;align-items:center;gap:12px;margin-top:10px}.ring svg{width:54px;height:54px;flex:none}
.fl{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:10;text-align:center;padding:20px}.fl.on{display:grid}
.fl .tm{font-size:min(22vw,120px);font-weight:700;color:var(--accent);display:block;line-height:1.1}
.fl .form{max-width:420px;margin:20px auto 0;text-align:left}
.cmp{width:100%;height:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.rep table{width:100%;border-collapse:collapse;font-size:14px}.rep th,.rep td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
.seg{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.seg .on{background:var(--accent);color:var(--on,#fff)}
label.mute{display:block}
@media print{body.pr{--ink:#000;--mute:#444;--line:#999;--bg:#fff;--panel:#fff;background:#fff;color:#000}body.pr main>:not(#app),body.pr #app>:not(.rep){display:none!important}body.pr .rep{box-shadow:none;border:0}body.pr .noprint{display:none!important}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on,#fff);padding:12px 18px;border-radius:6px;display:none;z-index:11;max-width:90%;text-align:center}#toast.on{display:block}
.logo{width:28px;height:28px;vertical-align:-6px;margin-right:8px}input[readonly]{font-size:12px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:9;text-align:center}
.ov.on{display:grid}
.ov>div{padding:30px 44px;border:2px solid var(--accent);background:var(--panel);border-radius:8px;box-shadow:0 0 60px var(--accent);animation:pop .5s ease-out}
.lu{font-size:42px;font-weight:700;color:var(--accent)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ov>div{animation:none}}
@media (max-width:520px){.status{grid-template-columns:1fr}.tabs button{padding:0 4px}.q{grid-template-columns:1fr}}
</style>
</head>

</main>

};
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36)}
function pad(n){return String(n).padStart(2,'0')}

function monday(s){var dw=(new Date(utc(s)).getUTCDay()+6)%7;return addDays(s,-dw)}

function el(id){return document.getElementById(id)}
function wd(s){return (new Date(utc(s)).getUTCDay()+6)%7}

function restCount(a,b){var n=0;(S.rests||[]).forEach(function(r){var lo=r.a>a?r.a:addDays(a,1),hi=r.b<b?r.b:b;if(hi>=lo)n+=diff(lo,hi)+1});return n}
function reqFor(k,d){var q=k.qm;if(S.set.smart){var e=null;k.wfh.forEach(function(x){if(x.from<=d)e=x});if(e)q=Math.max(10,Math.round(q*e.f[wd(d)]/5)*5)}return q}

var RC={E:['#aab4c8','#586274','#0b1020'],D:['#3fd07a','#1c8f47','#0b1020'],C:['#4d97ff','#1f5eff','#ffffff'],B:['#b07cff','#7a3fe0','#0b1020'],A:['#ffb02e','#b86e00','#0b1020'],S:['#ff5468','#c81e3a','#0b1020']};

  if(rv==='y0'){pre=t.slice(0,4);lab='This year ('+pre+')'}

function streakOf(dm){
  var keys=Object.keys(dm).sort();if(!keys.length)return {n:0,left:1};
  var n=0,d=today(),used={},cur=true;
  for(var g=0;g<4000;g++){
    if(d<keys[0])break;
    if(dm[d]){n++}else if(!cur){if(!inRest(d)){var w=monday(d);if(!used[w])used[w]=1;else break}}
    cur=false;d=addDays(d,-1);
  }
  return {n:n,left:used[monday(today())]?0:1};
}
function calc(){
  var I=S.skills.map(function(k){
    var dm=dayMaps(k),b=0,qb=0,rv=0,d;
    for(d in dm.w)b+=Math.min(CAP,dm.w[d]);
    for(d in dm.m)if(dm.m[d]>=reqFor(k,d))qb+=10;
    k.rev.forEach(function(r){rv+=r.s*15});
    return {k:k,m:dm.m,w:dm.w,b:b,qb:qb,rv:rv,last:(function(){var l=k.logs.length?k.logs[k.logs.length-1].d:k.cd;return k.rs&&k.rs>l?k.rs:l})()};
  });
  var dates={};I.forEach(function(i){for(var d in i.m)dates[d]=1});
  Object.keys(dates).forEach(function(d){
    var e=I.filter(function(i){return i.k.cd<=d&&!i.k.pz});
    if(e.length&&e.every(function(i){return (i.m[d]||0)>=reqFor(i.k,d)}))e.forEach(function(i){i.qb+=5});
  });
  I.forEach(function(i){i.own=i.b+i.qb+i.rv});
  I.forEach(function(i){
    var t=0,dc=0;
    I.forEach(function(c){if(c.k.par===i.k.id)t+=c.own*.2});
    i.k.dec.forEach(function(e){dc+=e.x});
    var fd=i.k.dec.length?i.k.dec[0].d:null,nq=0,dd;if(fd)for(dd in i.m)if(dd>fd&&i.m[dd]>=reqFor(i.k,dd))nq++;i.rc=Math.min(dc*.7,nq*15);i.tree=t;i.dc=dc;i.xp=Math.max(0,i.own+t-dc+i.rc);
    i.raw=level(i.xp);i.cap=MAXL[i.k.un];i.L=Math.min(i.raw,i.cap);
    i.gated=i.L>=i.cap&&i.k.un<5;i.idle=Math.max(0,diff(i.last,today())-restCount(i.last,today()));
  });
  return I;
}

function applyDecay(){

    L.forEach(function(x){h+='<div class="mute">'+esc(x[0])+'</div><input readonly data-sel="1" value="'+esc(base+'?q='+encodeURIComponent(x[1]))+'" aria-label="Link for '+esc(x[0])+'">'});
    h+='</div>';
  });
  return h+'</section>';
}
document.addEventListener('click',function(e){
  if(e.target.closest('#ov')){el('ov').className='ov';return}
  var b=e.target.closest('button');if(!b||!b.dataset)return;var d=b.dataset,v,k;
  if(d.tab){view=d.tab;render();return}
  if(d.q){v=d.q.split(':');log(v[0],+v[1],1,'')}
  else if(d.open){el('f'+d.open).classList.toggle('open')}
  else if(d.save){if(K(d.save).mode==='act')logAct(d.save,+el('a'+d.save).value,el('m'+d.save).value,+el('q'+d.save).value,el('n'+d.save).value);else log(d.save,+el('m'+d.save).value,+el('q'+d.save).value,el('n'+d.save).value)}
  else if(d.qa){v=d.qa.split(':');var qa=K(v[0]).acts[+v[1]];if(qa)logAct(v[0],+v[1],qa.st,1,'')}
  else if(d.undo){v=d.undo.split(':');K(v[0]).logs.splice(+v[1],1);afterChange()}
  else if(d.add){var tv=el('tpl').value,tp=tv==='__count'?CT:T[tv],nm=el('newname').value.trim()||(T[tv]?tv:'');if(!nm)return;S.skills.push(newSkill(nm,tp));afterChange()}
  else if(d.start){S.timer={id:d.start,start:Date.now()};save();render()}
  else if(d.cancel){S.timer=null;closeFocus();save();render()}
  else if(d.focus){openFocus()}
  else if(d.fx){closeFocus()}
  else if(d.stop){var fo=el('fl').classList.contains('on'),mins=Math.round((Date.now()-S.timer.start)/60000),q=+el(fo?'fq':'tq').value,nt=el(fo?'fn':'tn').value;S.timer=null;closeFocus();if(mins<1){save();render();return}log(d.stop,mins,q,nt)}
  else if(d.pass){if(b.dataset.armed){k=K(d.pass);k.bl.push({d:today(),r:k.un+1});k.un++;afterChange()}else{b.dataset.armed='1';b.textContent='Tap again to confirm you passed'}}
  else if(d.rv){v=d.rv.split(':');K(v[0]).rev.push({w:monday(today()),d:today(),s:+v[1]});afterChange()}
  else if(d.ssave){k=K(d.ssave);k.sh.push({d:today(),v:k.stats.map(function(s){return s.v})});save();render()}
  else if(d.del){if(b.dataset.armed){S.skills=S.skills.filter(function(s){return s.id!==d.del});S.skills.forEach(function(s){if(s.par===d.del)s.par=null});if(S.timer&&S.timer.id===d.del)S.timer=null;afterChange()}else{b.dataset.armed='1';b.textContent='Tap again to remove for good'}}
  else if(d.qs){var wn=el('wname');if(wn&&wn.value.trim())S.name=wn.value.trim();S.skills.push(newSkill(d.qs,T[d.qs]));afterChange()}
  else if(d.pz){var pk=K(d.pz);pk.pz=!pk.pz;if(!pk.pz)pk.rs=today();afterChange()}
  else if(d.share){shareCard()}
  else if(d.csv){var rows=['date,skill,amount,unit,effort,points,note'],qf=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'};S.skills.forEach(function(k){k.logs.forEach(function(l){rows.push([l.d,qf(k.name),l.a?l.a.c:l.m,l.a?l.a.u:'min',l.q,l.m,qf(l.note)].join(','))})});var tb=el('backup');tb.value=rows.join('\n');tb.select();el('msg').textContent='Copy this text and paste it into a spreadsheet app.'}
  else if(d.aadd){K(d.aadd).acts.push({n:'Activity',u:'reps',r:1,st:10});save();render()}
  else if(d.adel){v=d.adel.split(':');K(v[0]).acts.splice(+v[1],1);save();render()}
  else if(d.rest){var ra=el('ra').value,rb=el('rb').value;if(ra&&rb&&ra<=rb){S.rests.push({a:ra,b:rb});afterChange()}}
  else if(d.rdel){S.rests.splice(+d.rdel,1);afterChange()}
  else if(d.per){rv=d.per;render()}
  else if(d.print){document.body.classList.add('pr');try{window.print()}catch(x){}}
  else if(d.exp){var t=el('backup');S.lb=today();save();t.value=JSON.stringify(S);t.select();el('msg').textContent='Backup ready. Copy it and store it safely.'}
  else if(d.imp){try{var p=JSON.parse(el('backup').value);if(!p||!Array.isArray(p.skills))throw 0;S=migrate(p);applyPace();save();applyDecay();afterChange()}catch(x){el('msg').textContent='That text is not a valid backup.'}}
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset||{},v;
  if(t.id==='tpl'){el('plan').textContent=T[t.value]?T[t.value].p:t.value==='__count'?CT.p:'Add a custom skill and write your own boss challenges in Details.'}
  else if(t.id==='hname'){S.name=t.value.trim()||'Hunter';save()}
  else if(t.id==='dec'){S.set.decay=t.checked;var y=addDays(today(),-1);S.skills.forEach(function(k){k.dt=y});save()}
  else if(t.id==='snd'){S.set.snd=t.checked;save()}
  else if(t.id==='zoom'){S.set.zoom=+t.value;save();render()}
  else if(t.id==='pace'){S.set.pace=t.value;applyPace();afterChange()}
  else if(t.id==='smart'){S.set.smart=t.checked;if(t.checked)updFactors();save();render()}
  else if(t.id==='rem'){S.set.remind=t.value;save();banner(calc())}
  else if(d.boss){v=d.boss.split(':');K(v[0]).boss[+v[1]]=t.value.trim();save()}
  else if(d.sn){v=d.sn.split(':');K(v[0]).stats[+v[1]].n=t.value.trim()||'Stat';save()}
  else if(d.qt){K(d.qt).qt=t.value.trim()||'Practice session';save()}
  else if(d.qm){K(d.qm).qm=Math.max(5,Math.min(240,+t.value||30));save();render()}
  else if(d.an){var av=d.an.split(':'),ao=K(av[0]).acts[+av[1]],af=av[2];if(ao){if(af==='n'||af==='u')ao[af]=t.value.trim()||ao[af];else ao[af]=Math.max(.01,+t.value||ao[af]);save();render()}}
  else if(d.wg){K(d.wg).wg=Math.max(0,Math.min(80,+t.value||0));save();render()}
  else if(d.par){K(d.par).par=t.value||null;afterChange()}
});
